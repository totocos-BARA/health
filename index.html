<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>식단 관리</title>
  <meta name="description" content="먹은 음식과 운동을 기록하고 오늘의 칼로리·영양소 균형을 확인하는 식단 관리 앱">
  <meta name="theme-color" content="#16a34a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="식단 관리">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="date-nav" id="dateNav">
      <button class="day-btn" id="prevDay" aria-label="전날로">
        <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg><span>전날</span>
      </button>
      <button class="date-label" id="dateLabel" aria-label="오늘로 이동"></button>
      <button class="day-btn" id="nextDay" aria-label="다음 날로">
        <span>다음날</span><svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg>
      </button>
    </div>
  </header>

  <div id="installBanner" class="install-banner" hidden></div>

  <main id="app">
    <section class="view" id="view-today"></section>
    <section class="view" id="view-food" hidden></section>
    <section class="view" id="view-exercise" hidden></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-profile" hidden></section>
  </main>

  <nav class="tabbar" aria-label="메뉴">
    <button data-tab="today" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>홈</span>
    </button>
    <button data-tab="food">
      <svg viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 0-3.5 2.5-3.5 6S15 13 17 13v8"/></svg>
      <span>음식</span>
    </button>
    <button data-tab="exercise">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span>운동</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>기록</span>
    </button>
    <button data-tab="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span>내 정보</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
